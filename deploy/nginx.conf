# /etc/nginx/sites-available/pescaderia
# Reemplazá gestion.tudominio.com.ar por tu dominio. Certbot agrega el bloque HTTPS solo.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gestion.tudominio.com.ar;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Límite extra contra fuerza bruta en el login
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/pescaderia-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/pescaderia-proxy.conf;
    }
}
