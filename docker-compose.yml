# DESARROLLO con Docker (opcional: sin Docker usá `npm run db:local`).
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/pescaderia   DB_POOL_MAX=10
#   Tests contra Postgres real:  TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/test npm test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pescaderia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Argentina/Cordoba
      PGTZ: America/Argentina/Cordoba
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  db_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata_dev:
